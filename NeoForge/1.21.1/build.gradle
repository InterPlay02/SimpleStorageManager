plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
base.archivesName = "SimpleStorageManager"

tasks.named('jar') {
    archiveFileName = "SimpleStorageManager-NeoForge-v${version}.jar"
}

// Mantém a versão do neoforge.mods.toml sincronizada com mod_version.
def modVersion = mod_version.toString()
tasks.named('processResources') {
    inputs.property 'mod_version', modVersion
    filesMatching('META-INF/neoforge.mods.toml') {
        expand([mod_version: modVersion])
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = "21.1.262"

    runs {
        client {
            client()

            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.each { arg ->
                    jvmArgument(arg)
                }
            }
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        mcreator {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

apply from: 'mcreator.gradle'

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'Sleeping Town'
        url = 'https://repo.sleeping.town/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'Jared\'s maven'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
}

// O Maven da Modrinth nao fornece metadados de versao confiaveis para o Storage Drawers,
// entao o range declarado e ancorado no ID da versao usada para compilar.
configurations.configureEach {
    resolutionStrategy.force "maven.modrinth:storagedrawers:${storagedrawers_compile_id}"
}

dependencies {
    compileOnly "maven.modrinth:sophisticated-core:${sophisticated_core_version}"
    compileOnly "maven.modrinth:sophisticated-storage:${sophisticated_storage_version}"
    compileOnly "maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_version}"
    compileOnly "maven.modrinth:storagedrawers:${storagedrawers_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    compileOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
}
