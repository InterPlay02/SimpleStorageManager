org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Sophisticated Core mod version
sophisticated_core_version=1.5.17.2426
# Sophisticated Storage mod version
sophisticated_storage_version=1.6.9.2199
# Versao do Sophisticated Backpacks instalado no ambiente
sophisticated_backpacks_version=3.26.14.2222
# ID da versão no Modrinth (não o número legível 13.11.4): fixa o jar exato
storagedrawers_version=px0CCB06
# Versão mínima do EMI (Every Mod Is Included) usada para compilar a integração de transferência de receitas.
# Qualquer versão >= 1.1.24+1.21.1 é compatível.
emi_version=[1.1.24+1.21.1,)
# Versão mínima do JEI (Just Enough Items) usada para compilar a integração de compatibilidade de GUI.
# Qualquer versão >= 19.71.0.470 é compatível.
jei_version=[19.71.0.470,)
# Versão mínima do REI (Roughly Enough Items) para Minecraft 1.21.1 / NeoForge 21.1.x.
# 16.0.799 é a versão desejada; qualquer 16.x mais nova também é aceita. 17.x+ muda de Minecraft.
rei_version=[16.0.799,17.0.0)