# Versão do mod (usada no nome do JAR e no neoforge.mods.toml).
# Ao publicar uma nova versão, altere apenas esta linha.
mod_version=1.1.1

org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Sophisticated Core mod version
# Range de compatibilidade: a partir da versao atual (1.5.17.2426) ate a v1.5.18.
sophisticated_core_version=[1.21.1-1.5.17.2426,1.21.1-1.5.18)
# Sophisticated Storage mod version
sophisticated_storage_version=[1.21.1-1.6.9.2199,1.21.1-1.6.10)
# Versao do Sophisticated Backpacks instalado no ambiente
sophisticated_backpacks_version=[1.21.1-3.26.14.2222,1.21.1-3.26.15)
# Storage Drawers: o Maven da Modrinth nao publica um maven-metadata.xml consistente
# (o artifactId diverge), entao o Gradle nao consegue resolver ranges deste artefato.
# Range aberto a partir da versao atual (v13.11.4, ID do Modrinth px0CCB06).
storagedrawers_version=[px0CCB06,)
# ID da versao usada para compilar (o Maven da Modrinth so resolve versoes exatas deste artefato).
storagedrawers_compile_id=px0CCB06
# Versão mínima do EMI (Every Mod Is Included) usada para compilar a integração de transferência de receitas.
# Qualquer versão >= 1.1.24+1.21.1 é compatível.
emi_version=[1.1.24+1.21.1,)
# Versão mínima do JEI (Just Enough Items) usada para compilar a integração de compatibilidade de GUI.
# Qualquer versão >= 19.71.0.470 é compatível.
jei_version=[19.71.0.470,)
# Versão mínima do REI (Roughly Enough Items) para Minecraft 1.21.1 / NeoForge 21.1.x.
# 16.0.799 é a versão desejada; qualquer 16.x mais nova também é aceita. 17.x+ muda de Minecraft.
rei_version=[16.0.799,17.0.0)