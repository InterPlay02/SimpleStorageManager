[[dependencies.simplestoragemanager]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.262,21.2)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.simplestoragemanager]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1]"
    ordering="AFTER"
    side="BOTH"

# EMI (Every Mod Is Included) is an optional soft dependency: the mod works without it.
# The recipe transfer integration is only loaded when EMI is actually installed.
[[dependencies.simplestoragemanager]]
    modId="emi"
    type="optional"
    versionRange="[1.1.24+1.21.1,)"
    ordering="AFTER"
    side="CLIENT"

# Roughly Enough Items (REI) is an optional soft dependency: the mod works without it.
# The recipe transfer and stack provider integration is only loaded when REI is actually installed.
[[dependencies.simplestoragemanager]]
    modId="roughlyenoughitems"
    type="optional"
    versionRange="[16.0.799,)"
    ordering="AFTER"
    side="CLIENT"


