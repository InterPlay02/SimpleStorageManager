modLoader="javafml"
loaderVersion="[4,)"
license="MIT"

[[mods]]
modId="simplestoragemanager"
version="${mod_version}"
displayName="Simple Storage Manager"
logoFile="assets/simplestoragemanager/textures/mod_logo.png"
displayURL=""
credits="Created using the help of a bunch of AI agents."
authors="InterPlay"
description="A Minecraft mod that lets you access your storage from anywhere, without having to walk back and forth to your chests."

# Start of user code block mod configuration
