plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version 'TODO'
}

version = 'TODO'
base.archivesName = "SimpleStorageManager"

// TODO: Set the Java toolchain and mappings for the target Minecraft version.

neoForge {
    version = project.property('neo_version')

    runs {
        client {
            client()

            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.each { arg ->
                    jvmArgument(arg)
                }
            }
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        simplestoragemanager {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:TODO'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:TODO'
}

tasks.test {
    useJUnitPlatform()
}
