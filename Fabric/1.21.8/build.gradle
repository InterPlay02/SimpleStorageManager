plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

// Export name pattern: SimpleStorageManager-Fabric-v<mod_version> (e.g. v1.1)
version = "v${project.mod_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // CurseMaven hosts the confirmed Fabric 1.21.8 builds of REI and Storage Drawers.
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    // REI API artifact supplies the Architectury/cloth types referenced by its signatures.
    maven { url = 'https://maven.shedaniel.me' }
}

loom {
    accessWidenerPath = file("src/main/resources/simplestoragemanager.accesswidener")

    // Keep a dedicated client source set so loader-independent (main/common) code stays
    // separate from client-only code (screens, recipe-viewer integrations).
    splitEnvironmentSourceSets()

    mods {
        "simplestoragemanager" {
            sourceSet sourceSets.main
                   sourceSet sourceSets.client
        }
    }
}

dependencies {
    // To change the versions see gradle.properties
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Optional integrations: compile only, never bundled in the exported jar.
    modCompileOnly "curse.maven:storage-drawers-223852:6967708"    // Storage Drawers 18.3.2 Fabric 1.21.8
    modCompileOnly "curse.maven:roughly-enough-items-310111:6833148" // REI 20.0.811 Fabric 1.21.8
    // O JAR do CurseMaven não tem dependências transitivas; a API do maven REI traz
    // Architectury/cloth-config no compile classpath (nada é embutido no JAR final).
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:20.0.811"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    def modVersion = project.mod_version
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        // fabric.mod.json adds the "v" prefix itself, so pass the raw mod_version here.
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    // Loom attaches sourcesJar to the RemapSourcesJar task and to the build task.
    withSourcesJar()
}

