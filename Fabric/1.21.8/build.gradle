plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Optional compileOnly integrations (EMI/JEI/REI, Sophisticated, Storage Drawers)
    // will be declared here during Phase 3, together with their Fabric 1.21.8 artifacts.
    // They must remain compileOnly / modCompileOnly and must never be bundled in the jar.
}

loom {
    // Keep a dedicated client source set so loader-independent (main/common) code stays
    // separate from client-only code (screens, recipe-viewer integrations).
    splitEnvironmentSourceSets()

    mods {
        "simplestoragemanager" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // To change the versions see gradle.properties
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    // Loom attaches sourcesJar to the RemapSourcesJar task and to the build task.
    withSourcesJar()
}

