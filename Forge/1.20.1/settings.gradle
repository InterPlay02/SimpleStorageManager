pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        // Necessario para resolver o plugin ForgeGradle.
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        // Mantido do setup anterior; nao e necessario para Forge, mas preservado.
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    // Versao do MDK oficial de Forge 1.20.1 / 47.4.28.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'SimpleStorageManager-Forge-1.20.1'
