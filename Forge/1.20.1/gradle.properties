# Setup Forge 1.20.1 / Forge 47.4.28 (MDK oficial).
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
# ForgeGradle 6 nao e confiavel com o configuration cache do Gradle; desligado ate validacao.
org.gradle.configuration-cache=false

# Ambiente / versoes
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.28
forge_version_range=[47,)
loader_version_range=[47,)

# Mapeamentos oficiais Mojang (padrao do MDK).
mapping_channel=official
mapping_version=1.20.1

# Metadados do mod (mesmos IDs do projeto original).
mod_id=simplestoragemanager
mod_name=Simple Storage Manager
mod_license=MIT
mod_version=1.0.0
mod_group_id=net.interplay
mod_authors=InterPlay
mod_description=A Minecraft mod that lets you access your storage from anywhere, without having to walk back and forth to your chests.

# Versoes de referencia para a FUTURA etapa de portabilidade (nao usadas neste build).
